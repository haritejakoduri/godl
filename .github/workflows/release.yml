name: Release

# Runs only after CI has finished on master (never publishes a build
# that failed go vet/gofmt/test) — see ci.yml, which triggers on both
# push and pull_request to master; workflow_run's branch filter below
# only matches the push-to-master case (a merged PR), not the
# pre-merge PR check itself, since a release only makes sense once
# code actually lands on master.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  # Decides whether there is anything to release at all, so the build
  # jobs below don't spend runner time on a commit that isn't a new
  # version. internal/version/version.go is bumped by hand per release
  # (see its own doc comment) rather than auto-derived — this workflow
  # respects that instead of minting a version on every push.
  check:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(grep -oP '(?<=Version = ")[^"]+' internal/version/version.go)"
          if [ -z "$VERSION" ]; then
            echo "::error::couldn't read version from internal/version/version.go"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} already has a release; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # Everything that can be produced on Linux: the Linux binary, the
  # Windows installer, and the .deb.
  build-linux:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev

      - name: Build
        run: ./scripts/build-all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error

  # macOS is built on a Mac, not cross-compiled, because its system tray
  # needs Cocoa and therefore cgo and the macOS SDK. A CGO_ENABLED=0
  # cross-compile would still produce a working godl, just one silently
  # missing the tray — see scripts/build-darwin.sh, which fails rather
  # than let that ship.
  build-macos:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: ./scripts/build-darwin.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: error

  release:
    needs: [check, build-linux, build-macos]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh dist/
          gh release create "${{ needs.check.outputs.tag }}" \
            --title "godl ${{ needs.check.outputs.version }}" \
            --generate-notes \
            --target "${{ github.event.workflow_run.head_sha }}" \
            dist/*
