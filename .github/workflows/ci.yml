name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # darwin is here as a CGO_ENABLED=0 cross-compile on purpose: it
        # proves a macOS build without cgo still compiles, which is the
        # path tray/app_unsupported.go exists to keep working. The real
        # macOS build is the separate job below.
        goos: [linux, darwin, windows]
        goarch: [amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: build
        if: matrix.goos != 'windows'
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null .

      - name: build windows installer (exercises the release script)
        if: matrix.goos == 'windows'
        run: ./scripts/build-windows-installer.sh

      # .deb/.rpm are also only ever built for real by release.yml, and
      # only on a version bump (it skips the build entirely when the
      # current version's tag already exists) — so without this, a
      # break in either packaging script would go unnoticed by every
      # push/PR and only surface at the next actual release. Building
      # them here, every run, catches that immediately instead, the
      # same reason the Windows installer is built above rather than
      # only at release time.
      - name: install linux packaging tools
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev rpm

      # Both architectures of each, not just the host's: cross-building
      # a package is where the arch-specific footguns live (rpmbuild
      # refuses a spec that names a BuildArch other than the host's,
      # which is only discoverable by actually running it).
      - name: build .deb (exercises the release script)
        if: matrix.goos == 'linux'
        run: |
          ./scripts/build-deb.sh amd64
          ./scripts/build-deb.sh arm64

      - name: build .rpm (exercises the release script)
        if: matrix.goos == 'linux'
        run: |
          ./scripts/build-rpm.sh x86_64
          ./scripts/build-rpm.sh aarch64

      # Every architecture the release publishes a raw binary for, so a
      # change that breaks one of them fails on the PR rather than at
      # release time. One step rather than more matrix jobs: these are
      # compile checks, and they take seconds each.
      - name: cross-compile every published target
        if: matrix.goos == 'linux'
        env:
          CGO_ENABLED: 0
        run: |
          for t in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "-> $t"
            GOOS="${t%/*}" GOARCH="${t#*/}" go build -o /dev/null .
          done

      # Android is not published, so it is not in the loop above — but
      # it is checked, because it is the one target whose build breaks
      # from a change made for Linux: Go satisfies the "linux" build
      # constraint on Android too. Without this, that only surfaces
      # whenever someone next tries to build the Android side.
      - name: build for Android (exercises the release script)
        if: matrix.goos == 'linux'
        run: ./scripts/build-android.sh

      - name: test
        if: matrix.goos == 'linux'
        run: go test ./...

      # godl is concurrent throughout — a daemon juggling per-job
      # goroutines, chunked downloads, a shared rate limiter and a
      # per-host request gate — so the race detector earns its runtime
      # here. CGO_ENABLED is required for -race specifically; the build
      # steps above stay at 0 so release binaries remain static.
      - name: test (race detector)
        if: matrix.goos == 'linux'
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 ./...

  # The published macOS binary is built here rather than cross-compiled,
  # because the tray needs Cocoa and so needs cgo and the macOS SDK (see
  # scripts/build-darwin.sh). Running it in CI as well as at release
  # time means a change that breaks the macOS build is caught on the PR
  # instead of after the merge, when Release would be the first thing to
  # try it.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: build (cgo, with tray)
        run: ./scripts/build-darwin.sh

      - name: test
        run: go test ./...

      - name: test (race detector)
        run: go test -race -count=1 ./...
